<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradient for standard Ethereum top facets -->
    <linearGradient id="eth-green-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="100%" stop-color="#00B341"/>
    </linearGradient>

    <!-- Darker gradient for side/bottom facets to add 3D depth -->
    <linearGradient id="eth-green-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B341"/>
      <stop offset="100%" stop-color="#006625"/>
    </linearGradient>

    <linearGradient id="eth-green-accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80FFB3"/>
      <stop offset="100%" stop-color="#00FF66"/>
    </linearGradient>
  </defs>

  <!-- Main Ethereum Shape styled as 4chan Green -->
  <g transform="translate(0, 8)">
    <!-- Top-Left Facet -->
    <polygon points="256,40 100,256 256,210" fill="url(#eth-green-accent)"/>

    <!-- Top-Right Facet -->
    <polygon points="256,40 256,210 412,256" fill="url(#eth-green-top)"/>

    <!-- Bottom-Left Facet -->
    <polygon points="256,230 100,276 256,448" fill="url(#eth-green-dark)"/>

    <!-- Bottom-Right Facet -->
    <polygon points="256,230 256,448 412,276" fill="url(#eth-green-top)" opacity="0.85"/>
  </g>

  <!-- 4chan Leaf Nodes integrated onto the 4 main Ethereum corners -->
  <!-- Top Leaf -->
  <circle cx="256" cy="48" r="32" fill="#00FF66"/>
  <!-- Left Leaf -->
  <circle cx="100" cy="264" r="32" fill="#00B341"/>
  <!-- Right Leaf -->
  <circle cx="412" cy="264" r="32" fill="#00B341"/>
  <!-- Bottom Leaf -->
  <circle cx="256" cy="456" r="32" fill="#006625"/>

  <!-- Center Accent -->
  <circle cx="256" cy="224" r="14" fill="#003311"/>
  <circle cx="256" cy="224" r="8" fill="#00FF66"/>
</svg>
